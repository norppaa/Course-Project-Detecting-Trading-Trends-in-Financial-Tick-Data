networks:
  redpanda-net:
    driver: bridge

volumes:
  redpanda-data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # internal: for other docker containers, external: for apps running directly on localhost
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092" # Kafka API for localhost apps (Go producer/consumer)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda-net

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080" # Web UI
    networks:
      - redpanda-net
    depends_on:
      - redpanda

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Waiting for Redpanda to be ready...';
        while ! rpk cluster info --brokers redpanda:9092 > /dev/null 2>&1; do
          sleep 1;
        done;
        echo 'Redpanda is ready! Creating topics...';
        rpk topic create market-ticks --brokers redpanda:9092 --partitions 4 || true;
        rpk topic create trading-signals --brokers redpanda:9092 --partitions 4 || true;
        echo 'Topics initialized successfully!';
        rpk topic list --brokers redpanda:9092;
      "
    networks:
      - redpanda-net
