networks:
  redpanda-net:
    name: redpanda-net
    driver: bridge

volumes:
  redpanda-data:

services:
  # ============================================================
  # 1. MESSAGE BROKER & INFRASTRUCTURE (Always started by default)
  # ============================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # internal: for containers in docker network (redpanda:9092)
      # external: for apps running directly on localhost (localhost:19092)
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092" # Kafka API for host applications (e.g. go run)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers redpanda:9092 > /dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080" # Web UI: http://localhost:8080
    networks:
      - redpanda-net
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Redpanda is healthy! Initializing topics...';
        rpk topic create market-ticks --brokers redpanda:9092 --partitions 12 || true;
        rpk topic create trading-signals --brokers redpanda:9092 --partitions 12 || true;
        echo 'Topics initialized successfully:';
        rpk topic list --brokers redpanda:9092;
      "
    networks:
      - redpanda-net

  # ============================================================
  # 2. APPLICATION SERVICES (Enabled via: docker compose --profile app up)
  # ============================================================
  producer:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: tick-producer
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - INPUT_FILE=/data/trades_cleaned.csv.gz
      - REPLAY_MODE=max       # Options: "max" (fastest benchmark), "rate", or "realtime"
      - RATE_LIMIT=10000      # Events/sec (used if REPLAY_MODE=rate)
      - SPEED_FACTOR=10.0     # Multiplier (used if REPLAY_MODE=realtime, e.g. 10x speed)
      - ONLY_TRADES=true      # Filter to events with non-empty Last price
      - HEARTBEAT_INTERVAL=1s # Event time between heartbeats, 0 = none
    volumes:
      - ./data:/data:ro
    networks:
      - redpanda-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      wait-for-analyzers:
        condition: service_completed_successfully

  # Holds the producer back until all analyzer instances have joined the
  # consumer group. If the replay started earlier, partitions would move
  # between instances mid-run and their EMAs would restart from zero.
  wait-for-analyzers:
    profiles: ["app", "all"]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: wait-for-analyzers
    environment:
      - EXPECTED=${ANALYZERS:-1}
      - GROUP_ID=${GROUP_ID:-stream-analyzer}
      - TIMEOUT=60
    entrypoint: /bin/sh
    command: >
      -c '
        echo "Waiting for $$EXPECTED analyzer(s) in group $$GROUP_ID...";
        i=0;
        while [ $$i -lt $$TIMEOUT ]; do
          out=$$(rpk group describe "$$GROUP_ID" --brokers redpanda:9092 2>/dev/null);
          if echo "$$out" | grep -Eq "^MEMBERS +$$EXPECTED$$" && echo "$$out" | grep -Eq "^STATE +Stable$$"; then
            echo "Group $$GROUP_ID is stable with $$EXPECTED member(s), starting the producer.";
            exit 0;
          fi;
          i=$$((i + 1)); sleep 1;
        done;
        echo "$$out";
        echo "ERROR: group $$GROUP_ID did not reach $$EXPECTED stable member(s) in $${TIMEOUT}s.";
        echo "Set the instance count only with ANALYZERS=N, not with --scale.";
        exit 1
      '
    networks:
      - redpanda-net
    depends_on:
      analyzer:
        condition: service_started

  analyzer:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    # No container_name, so several instances can run. Set the count with
    # ANALYZERS=N (N <= 12 partitions); the producer waits until all have joined.
    deploy:
      replicas: ${ANALYZERS:-1}
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - GROUP_ID=${GROUP_ID:-stream-analyzer}  # use a new id to re-read the topic from the start
      - GRACE=5s                     # allowed out-of-orderness of event time
      - EMPTY_WINDOW_POLICY=skip     # skip | carry
      - SUPPRESS_FIRST_SIGNAL=false  # hide the BUY each symbol gets in its first window
      - IDLE_FLUSH=5s                # close all windows after this long without input
    networks:
      - redpanda-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  gateway:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: web-gateway
    ports:
      - "8081:8081" # WebSocket/HTTP API
    environment:
      - KAFKA_BROKERS=redpanda:9092
    networks:
      - redpanda-net
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  frontend:
    profiles: ["app", "all"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-frontend
    ports:
      - "3000:80"
    networks:
      - redpanda-net
    depends_on:
      - gateway
